
<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101426">
<title>RAIZEN — Cinematic Intro</title>

<style>
:root {
  color-scheme: dark;
  --bg: #101426;
  --text: #ffffff;
  --muted: #929bb8;
  --purple: #8B5CF6;
  --blue: #4389FF;
  --gold: #F1B94B;
}

html[data-theme="light"] {
  color-scheme: light;
  --bg: #f7f8ff;
  --text: #17172e;
  --muted: #69718c;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Inter, "Segoe UI", Arial, sans-serif;
}

body {
  min-height: 100svh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
}

button { font: inherit; }

.scene {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 44%,
      rgba(91, 74, 174, .13), transparent 45%),
    var(--bg);
  transition: background .5s ease, opacity .8s ease;
}

.scene::before,
.scene::after {
  content: "";
  position: absolute;
  pointer-events: none;
}

.scene::before {
  inset: 0;
  z-index: -1;
  opacity: .16;
  background-image:
    linear-gradient(rgba(139,92,246,.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139,92,246,.10) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse at center, black, transparent 75%);
}

.scene::after {
  inset: 18px;
  border: 1px solid rgba(139, 92, 246, .13);
  border-radius: 18px;
}

.ambient {
  position: absolute;
  width: min(75vw, 620px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(139,92,246,.18), rgba(67,137,255,.06) 42%, transparent 70%);
  filter: blur(15px);
  animation: breathe 4s ease-in-out infinite alternate;
  z-index: -1;
}

.content {
  width: min(92%, 600px);
  display: flex;
  align-items: center;
  flex-direction: column;
  text-align: center;
  padding: 28px 12px;
  animation: entrance 1s cubic-bezier(.2,.7,.2,1) both;
}

.emblem {
  width: 96px;
  height: 96px;
  overflow: visible;
  margin-bottom: 26px;
}

.emblem-frame {
  fill: none;
  stroke: url(#gradient);
  stroke-width: 1.8;
  stroke-dasharray: 260;
  stroke-dashoffset: 260;
  animation: draw .9s .15s ease forwards;
}

.emblem-mark {
  fill: none;
  stroke: url(#gradient);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 150;
  stroke-dashoffset: 150;
  animation: draw .65s .5s ease forwards;
}

.wordmark {
  display: flex;
  justify-content: center;
  gap: .035em;
  margin: 0;
  font-size: clamp(3.2rem, 10vw, 5.4rem);
  line-height: 1;
  font-weight: 900;
  letter-spacing: .13em;
}

.letter {
  display: inline-block;
  opacity: 0;
  transform: translateY(22px) scale(.92);
  background: linear-gradient(115deg, #4389FF 8%, #8B5CF6 65%, #B5A0FF);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  animation: letterIn .65s cubic-bezier(.16,1,.3,1) forwards;
}

.letter:nth-child(1) { animation-delay: .32s; }
.letter:nth-child(2) { animation-delay: .40s; }
.letter:nth-child(3) { animation-delay: .48s; }
.letter:nth-child(4) { animation-delay: .56s; }
.letter:nth-child(5) { animation-delay: .64s; }
.letter:nth-child(6) { animation-delay: .72s; }

.tagline {
  margin: 24px 0 0;
  font-size: clamp(.63rem, 2.2vw, .78rem);
  font-weight: 650;
  letter-spacing: .17em;
  line-height: 1.9;
  color: var(--muted);
  opacity: 0;
  animation: fadeIn .7s 1.05s ease forwards;
}

.separator {
  width: 36px;
  height: 2px;
  margin: 21px 0;
  background: var(--gold);
  transform: scaleX(0);
  animation: lineIn .45s 1.15s ease forwards;
}

.subline {
  font-size: .62rem;
  font-weight: 600;
  letter-spacing: .22em;
  color: var(--muted);
  opacity: 0;
  animation: fadeIn .6s 1.25s ease forwards;
}

.loading {
  width: 180px;
  margin-top: 42px;
}

.loading-track {
  height: 2px;
  overflow: hidden;
  background: rgba(139,92,246,.19);
}

.loading-bar {
  height: 100%;
  width: 35%;
  background: linear-gradient(90deg, var(--blue), var(--purple), var(--gold));
  animation: loading 1.5s ease-in-out infinite alternate;
}

.loading-label {
  margin-top: 13px;
  font-size: .56rem;
  font-weight: 600;
  letter-spacing: .2em;
  color: var(--muted);
}

.corner {
  position: absolute;
  bottom: 36px;
  color: var(--muted);
  font-size: .58rem;
  letter-spacing: .17em;
  opacity: .7;
}

.corner.left { left: 38px; }
.corner.right { right: 38px; }

.theme-toggle {
  position: absolute;
  top: 34px;
  right: 36px;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(139,92,246,.25);
  border-radius: 50%;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  transition: transform .2s, background .2s;
}

.theme-toggle:hover {
  transform: rotate(12deg);
  background: rgba(139,92,246,.1);
}

.replay {
  position: absolute;
  bottom: 70px;
  padding: 10px 16px;
  border: 1px solid rgba(139,92,246,.35);
  border-radius: 99px;
  background: rgba(139,92,246,.08);
  color: var(--text);
  font-size: .75rem;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity .4s;
}

.scene.finished .replay {
  opacity: 1;
  pointer-events: auto;
}

.scene.finished .loading-bar {
  animation: none;
  width: 100%;
}

.scene.finished .loading-label {
  color: var(--gold);
}

.scene.finished .loading-label::after {
  content: " — PRÊT";
}

@keyframes draw {
  to { stroke-dashoffset: 0; }
}

@keyframes letterIn {
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes fadeIn {
  to { opacity: 1; }
}

@keyframes lineIn {
  to { transform: scaleX(1); }
}

@keyframes breathe {
  from { transform: scale(.92); opacity: .7; }
  to { transform: scale(1.08); opacity: 1; }
}

@keyframes entrance {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes loading {
  from { transform: translateX(-15%); }
  to { transform: translateX(200%); }
}

@media (max-width: 600px) {
  .emblem { width: 76px; height: 76px; margin-bottom: 24px; }
  .tagline { max-width: 290px; }
  .scene::after { inset: 9px; border-radius: 13px; }
  .corner { bottom: 24px; font-size: .48rem; }
  .corner.left { left: 19px; }
  .corner.right { right: 19px; }
  .theme-toggle { top: 23px; right: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }

  .letter { opacity: 1; transform: none; }
  .emblem-frame, .emblem-mark { stroke-dashoffset: 0; }
  .tagline, .subline { opacity: 1; }
  .separator { transform: scaleX(1); }
}
</style>
</head>

<body>
<main class="scene" id="scene">
  <div class="ambient"></div>

  <button class="theme-toggle" id="themeToggle"
          aria-label="Changer de thème" title="Mode clair / sombre">
    ◐
  </button>

  <section class="content" aria-label="Introduction RAIZEN">
    <svg class="emblem" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="gradient" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#4389FF"/>
          <stop offset="55%" stop-color="#8B5CF6"/>
          <stop offset="100%" stop-color="#F1B94B"/>
        </linearGradient>
      </defs>
      <path class="emblem-frame"
            d="M50 7 L87 28 L87 68 L50 91 L13 70 L13 30 Z"/>
      <path class="emblem-mark"
            d="M32 67 L32 32 L53 32 Q69 32 69 45
               Q69 55 56 57 L70 70 M32 49 L53 49"/>
    </svg>

    <h1 class="wordmark" aria-label="RAIZEN">
      <span class="letter" aria-hidden="true">R</span>
      <span class="letter" aria-hidden="true">A</span>
      <span class="letter" aria-hidden="true">I</span>
      <span class="letter" aria-hidden="true">Z</span>
      <span class="letter" aria-hidden="true">E</span>
      <span class="letter" aria-hidden="true">N</span>
    </h1>

    <p class="tagline">TON UNIVERS. TA PASSION.<br>TA COMMUNAUTÉ.</p>
    <div class="separator"></div>
    <p class="subline">EXPLORE · COLLECTIONNE · ÉVOLUE</p>

    <div class="loading" aria-hidden="true">
      <div class="loading-track">
        <div class="loading-bar"></div>
      </div>
      <div class="loading-label" id="loadingLabel">INITIALISATION</div>
    </div>
  </section>

  <div class="corner left">RAIZEN / UNIVERSE</div>
  <div class="corner right">EST. 2026</div>

  <button class="replay" id="replay">↻ Rejouer la cinématique</button>
</main>

<script>
(() => {
  const scene = document.getElementById("scene");
  const toggle = document.getElementById("themeToggle");
  const replay = document.getElementById("replay");
  const label = document.getElementById("loadingLabel");
  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  let finishTimer;

  function play() {
    clearTimeout(finishTimer);
    scene.classList.remove("finished");
    label.textContent = "INITIALISATION";

    // Relance les animations CSS en réinitialisant la scène.
    scene.querySelectorAll(".letter, .emblem-frame, .emblem-mark, .tagline, .separator, .subline")
      .forEach(el => {
        el.style.animation = "none";
        void el.offsetWidth;
        el.style.animation = "";
      });

    finishTimer = setTimeout(() => {
      scene.classList.add("finished");
      label.textContent = "UNIVERS INITIALISÉ";
    }, reducedMotion ? 50 : 2200);
  }

  toggle.addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark"
      ? "light" : "dark";
    document.documentElement.dataset.theme = next;
  });

  replay.addEventListener("click", play);
  play();
})();
</script>
</body>
</html>
