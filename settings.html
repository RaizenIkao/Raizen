<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAIZEN | Réglages</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="settings-page">
    <div class="settings-shell">
      <header class="settings-header">
        <div class="brand">RAIZEN</div>
        <nav class="nav-inline">
          <a href="index.html">Accueil</a>
          <a href="profile.html">Profil</a>
          <a class="active" href="settings.html">Réglages</a>
        </nav>
      </header>

      <main class="settings-panel">
        <h1>Paramètres du compte</h1>

        <form id="settingsForm" class="settings-form">
          <div class="form-grid">
            <label>
              <span>Pseudo</span>
              <input id="settingsPseudo" type="text" value="Raizen" />
            </label>

            <label>
              <span>Email</span>
              <input id="settingsEmail" type="email" value="raizen@example.com" />
            </label>
          </div>

          <label>
            <span>Thème de bannière</span>
            <select id="settingsTheme">
              <option value="linear-gradient(135deg, rgba(139,92,246,0.7), rgba(67,137,255,0.6))">Violet / Bleu</option>
              <option value="linear-gradient(135deg, rgba(52,211,153,0.65), rgba(59,130,246,0.6))">Vert / Bleu</option>
              <option value="linear-gradient(135deg, rgba(245,158,11,0.7), rgba(239,68,68,0.6))">Orange / Rouge</option>
            </select>
          </label>

          <button type="submit" class="btn btn-primary">Sauvegarder</button>
        </form>
      </main>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
