<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAIZEN | Réglages</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="settings-page">
    <div class="settings-shell">
      <header class="settings-header">
        <div class="brand">RAIZEN</div>
        <nav class="nav-inline">
          <a href="index.html">Accueil</a>
          <a href="profile.html">Profil</a>
          <a class="active" href="settings.html">Réglages</a>
        </nav>
      </header>

      <main class="settings-panel">
        <h1>Paramètres du compte</h1>

        <form class="settings-form" id="settingsForm">
          <label>
            <span>Pseudo</span>
            <input type="text" value="Raizen" />
          </label>

          <label>
            <span>Email</span>
            <input type="email" value="raizen@example.com" />
          </label>

          <label>
            <span>Bio</span>
            <textarea rows="4">Fan de collections, d'univers manga et d'expériences RPG.</textarea>
          </label>

          <button type="submit" class="btn btn-primary">Sauvegarder</button>
        </form>
      </main>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
