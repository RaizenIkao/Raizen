<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAIZEN | Profil</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/profile.css" />
  </head>
  <body class="profile-page">
    <div class="profile-layout">
      <header class="profile-header">
        <div class="brand">RAIZEN</div>
        <nav class="nav-inline" aria-label="Profil navigation">
          <a href="index.html">Accueil</a>
          <a class="active" href="profile.html">Profil</a>
          <a href="settings.html">Réglages</a>
        </nav>
      </header>

      <section class="banner-surface" data-profile-banner>
        <button class="btn btn-light banner-edit" type="button">Modifier la bannière</button>
      </section>

      <section class="profile-card panel">
        <div class="avatar-large-wrap">
          <div class="avatar-large" data-profile-avatar>R</div>
          <button class="avatar-upload" type="button" aria-label="Modifier l’avatar">✎</button>
        </div>

        <div class="profile-meta">
          <span class="status">Collectionneur</span>
          <h1 data-user-name>Raizen</h1>
          <p data-user-bio>Fan de manga, anime et univers de cartes.</p>

          <div class="exp-bar">
            <span class="exp-fill" data-exp-fill></span>
          </div>
        </div>
      </section>

      <section class="stats-grid">
        <div class="stat-box-strong panel">
          <strong data-stat="cards">245</strong>
          <span>Cartes</span>
        </div>
        <div class="stat-box-strong panel">
          <strong data-stat="boosters">12</strong>
          <span>Boosters</span>
        </div>
        <div class="stat-box-strong panel">
          <strong data-stat="time">126 min</strong>
          <span>Temps de jeu</span>
        </div>
        <div class="stat-box-strong panel">
          <strong data-stat="level">Niv 12</strong>
          <span>Progression</span>
        </div>
      </section>

      <section class="collection-panel panel">
        <div class="panel-head">
          <h2>Collection</h2>
          <a href="index.html">Voir plus</a>
        </div>
        <div class="mini-cards">
          <div class="mini-card one">🐉</div>
          <div class="mini-card two">影</div>
          <div class="mini-card three">✧</div>
          <div class="mini-card four">⚡</div>
        </div>
      </section>
    </div>

    <script src="js/profile.js"></script>
  </body>
</html>
