<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAIZEN | Profil</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/profile.css" />
  </head>
  <body class="profile-page">
    <header class="profile-header">
      <div class="brand">RAIZEN</div>
      <nav class="nav-inline">
        <a href="index.html">Accueil</a>
        <a class="active" href="profile.html">Profil</a>
        <a href="settings.html">Réglages</a>
      </nav>
    </header>

    <main class="profile-layout">
      <section class="profile-card">
        <div class="avatar-large">R</div>
        <div class="profile-meta">
          <span class="status">Collectionneur</span>
          <h1>Raizen</h1>
          <p>Fan de manga, anime et univers de cartes.</p>
        </div>
      </section>

      <section class="stats-grid">
        <div class="stat-box">
          <strong>245</strong>
          <span>Cartes</span>
        </div>
        <div class="stat-box">
          <strong>18</strong>
          <span>Raretés</span>
        </div>
        <div class="stat-box">
          <strong>12</strong>
          <span>Paquets</span>
        </div>
      </section>

      <section class="collection-panel">
        <div class="panel-head">
          <h2>Collection</h2>
          <a href="index.html">Voir plus</a>
        </div>
        <div class="mini-cards">
          <div class="mini-card one">🐉</div>
          <div class="mini-card two">影</div>
          <div class="mini-card three">✧</div>
          <div class="mini-card four">⚡</div>
        </div>
      </section>
    </main>

    <script src="js/profile.js"></script>
  </body>
</html>
